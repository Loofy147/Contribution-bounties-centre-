name: Bug report
description: Report a reproducible product or engineering defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private user data, or payment details."
  - type: textarea
    id: problem
    attributes:
      label: Observed behavior
      description: What happened, and where?
      placeholder: Describe the observed result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/device and approximate time; remove identifiers.
    validations:
      required: false
