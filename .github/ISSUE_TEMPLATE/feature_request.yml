name: Feature request
description: Propose an improvement with a concrete outcome.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult, ambiguous, slow, or unreliable today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired observable outcome
      description: What should a user be able to do or verify after the change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable outcomes, one per line.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and alternatives
    validations:
      required: false
